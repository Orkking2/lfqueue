<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue Benchmark Results</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --ink: #1c2430;
      --muted: #687282;
      --line: #d7dce3;
      --panel: #ffffff;
      --accent: #2458c9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      display: grid;
      gap: 18px;
      padding: 20px 28px 28px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 12px 0;
    }

    .toolbar label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    select,
    button {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }

    select {
      padding: 0 30px 0 10px;
    }

    button {
      padding: 0 10px;
      cursor: pointer;
    }

    button.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #eef4ff;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 14px 16px 0;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 680;
      letter-spacing: 0;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: min(64vh, 520px);
      min-height: 360px;
      padding: 0 8px 8px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .axis,
    .tick line {
      stroke: #bec6d1;
      stroke-width: 1;
    }

    .grid-line {
      stroke: #edf0f4;
      stroke-width: 1;
    }

    .tick.text,
    .axis-label {
      fill: #667080;
      font-size: 12px;
    }

    .series-line {
      fill: none;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .point {
      stroke: #ffffff;
      stroke-width: 1.5;
      cursor: crosshair;
    }

    .error-bar {
      stroke-width: 1;
      opacity: 0.55;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 0 16px 16px;
      color: #3b4655;
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      display: inline-block;
    }

    .tooltip {
      position: fixed;
      z-index: 10;
      display: none;
      min-width: 210px;
      max-width: 280px;
      padding: 9px 10px;
      border: 1px solid #cfd6e1;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 10px 25px rgba(25, 35, 50, 0.12);
      pointer-events: none;
      font-size: 12px;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 12px 14px;
      min-height: 82px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat .value {
      margin-top: 7px;
      font-size: 17px;
      font-weight: 720;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .stat .detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 800px) {
      header {
        display: block;
        padding: 18px 16px 12px;
      }

      .meta {
        margin-top: 6px;
        white-space: normal;
      }

      main {
        padding: 14px 12px 18px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chart-wrap {
        height: 430px;
        min-height: 430px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Queue Benchmark Results</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="meta">Throughput assumes 20,000,000 queue operations per run. UBQ/RBBQ families are collapsed to winners.</div>
  </header>

  <main>
    <div class="summary" id="summary"></div>

    <div class="toolbar">
      <label>
        Series group
        <select id="group-select">
          <option value="all">All benchmarks</option>
          <option value="queues">Queue implementations only</option>
          <option value="rust">Rust queues</option>
          <option value="ubq">UBQ variants</option>
          <option value="c">C queues</option>
        </select>
      </label>
      <button type="button" data-scale="linear" class="active">Linear y</button>
      <button type="button" data-scale="log">Log y</button>
    </div>

    <div class="grid">
      <section>
        <div class="section-head">
          <h2>Elapsed Time</h2>
          <div class="note">Lower is better. Error bars show +/- margin of error.</div>
        </div>
        <div class="chart-wrap">
          <svg id="elapsed-chart" role="img" aria-label="Elapsed time by thread count"></svg>
        </div>
        <div class="legend" id="elapsed-legend"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>Throughput</h2>
          <div class="note">Higher is better. Mops/s = 20000 / mean_ms.</div>
        </div>
        <div class="chart-wrap">
          <svg id="throughput-chart" role="img" aria-label="Throughput by thread count"></svg>
        </div>
        <div class="legend" id="throughput-legend"></div>
      </section>
    </div>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const fallbackData = `#! Host: lab
#! Benchmarks: wfqueue wfqueue0 faa lcrq ccqueue msqueue delay rust-segqueue rust-arrayqueue rust-ubq rust-ubq-31 rust-ubq-127 rust-ubq-511 rust-ubq-2047 rust-ubq-pool4-2047 rust-ubq-yield-2047 rust-rbbq
#! Threads: 1 2 4 8 16 32
1 363.94 3.41 358.78 6.58 123.89 0.45 387.68 0.93 192.30 1.31 413.56 7.99 64.02 0.68 280.87 3.73 129.56 1.58 8430.76 21.67 898.90 5.64 1878.86 4.32 3913.63 17.64 8460.20 4.07 8554.23 23.54 8553.69 31.20 293.25 1.43
2 777.64 34.75 733.66 31.47 322.33 9.08 617.64 24.93 1218.41 36.77 1266.89 28.28 32.65 0.09 282.37 2.35 146.20 4.03 6554.06 190.13 711.14 16.21 1425.98 35.14 3068.52 110.63 6670.38 198.20 6644.43 203.72 21709.10 1277.07 1358.87 10.51
4 535.78 9.56 524.15 16.04 193.99 5.31 452.58 18.30 1007.58 15.45 1515.69 27.96 16.71 0.03 296.40 1.90 194.00 11.15 5107.47 116.61 553.62 22.61 1138.92 49.77 2448.26 93.69 5129.62 145.20 5149.11 196.75 18377.50 631.56 1811.68 5.13
8 388.85 5.11 387.92 4.40 183.88 3.20 398.55 8.20 734.42 14.15 2133.67 55.56 8.37 0.01 338.39 6.33 364.55 11.84 3793.28 75.35 437.40 8.37 902.53 14.78 1893.47 37.43 3831.66 69.69 4008.13 73.85 14437.84 187.71 2209.71 6.06
16 262.60 2.18 259.28 2.78 168.00 7.31 292.08 4.94 549.10 5.02 2495.22 115.63 7.26 0.01 421.89 12.23 620.76 19.80 2997.75 33.06 434.82 13.06 724.08 11.90 1507.62 20.95 2984.64 38.99 3195.03 51.51 13603.77 686.03 2623.11 24.74
32 251.49 4.90 260.11 8.99 152.07 12.77 286.62 5.66 1627.74 44.30 2407.41 63.92 2.93 0.14 395.16 6.60 705.51 14.10 2250.33 61.44 318.18 6.19 567.14 16.35 1199.78 21.01 2288.88 69.17 2583.62 59.98 10219.08 293.94 3881.70 35.77`;

    const colors = [
      "#1f77b4", "#d62728", "#2ca02c", "#9467bd", "#ff7f0e", "#17becf",
      "#7f7f7f", "#8c564b", "#e377c2", "#bcbd22", "#0f766e", "#2563eb",
      "#dc2626", "#16a34a", "#9333ea", "#ea580c", "#0891b2"
    ];

    const groups = {
      all: () => true,
      queues: name => name !== "faa" && name !== "delay",
      rust: name => name.startsWith("rust-"),
      ubq: name => name.startsWith("rust-ubq"),
      c: name => !name.startsWith("rust-") && name !== "faa" && name !== "delay"
    };

    const state = {
      group: "all",
      yScale: "linear"
    };

    let data = null;
    const tooltip = document.getElementById("tooltip");

    document.getElementById("meta").textContent = "Loading all-results.dat...";

    document.getElementById("group-select").addEventListener("change", event => {
      state.group = event.target.value;
      renderAll();
    });

    document.querySelectorAll("[data-scale]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-scale]").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        state.yScale = button.dataset.scale;
        renderAll();
      });
    });

    window.addEventListener("resize", () => {
      if (data) renderAll();
    });

    loadData().then(({ text, source }) => {
      data = parseData(text);
      document.getElementById("meta").textContent =
        `Source: ${source} | Host: ${data.host} | Threads: ${data.threads.join(", ")} | Benchmarks parsed: ${data.names.length}`;
      renderAll();
    });

    async function loadData() {
      try {
        const response = await fetch("all-results.dat", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return { text: await response.text(), source: "all-results.dat" };
      } catch (error) {
        return { text: fallbackData, source: "embedded fallback data" };
      }
    }

    function parseData(text) {
      const lines = text.trim().split(/\n+/);
      const host = lines.find(line => line.startsWith("#! Host:")).replace("#! Host:", "").trim();
      const names = lines.find(line => line.startsWith("#! Benchmarks:"))
        .replace("#! Benchmarks:", "")
        .trim()
        .split(/\s+/);
      const rows = lines
        .filter(line => !line.startsWith("#"))
        .map(line => line.trim().split(/\s+/).map(Number));

      const points = rows.map(row => {
        const threads = row[0];
        const values = names.map((name, index) => {
          const mean = row[1 + index * 2];
          const error = row[2 + index * 2];
          return {
            name,
            threads,
            mean,
            error,
            throughput: 20000 / mean
          };
        });
        return { threads, values };
      });

      return {
        host,
        names,
        threads: rows.map(row => row[0]),
        points
      };
    }

    function renderAll() {
      const selectedNames = visibleNames(data.names.filter(groups[state.group]));
      renderSummary(selectedNames);
      renderChart({
        svg: document.getElementById("elapsed-chart"),
        legend: document.getElementById("elapsed-legend"),
        selectedNames,
        metric: "mean",
        unit: "ms",
        yLabel: "Elapsed time (ms)",
        lowerIsBetter: true
      });
      renderChart({
        svg: document.getElementById("throughput-chart"),
        legend: document.getElementById("throughput-legend"),
        selectedNames,
        metric: "throughput",
        unit: "Mops/s",
        yLabel: "Throughput (Mops/s)",
        lowerIsBetter: false
      });
    }

    function visibleNames(names) {
      const nameSet = new Set(names);
      const ubqWinners = winnerNames(names.filter(isUbqVariant));
      const rbbqWinners = winnerNames(names.filter(isRbbqVariant));
      const collapsed = new Set([...ubqWinners, ...rbbqWinners]);

      return data.names.filter(name => {
        if (!nameSet.has(name)) return false;
        if (isUbqVariant(name) || isRbbqVariant(name)) return collapsed.has(name);
        return true;
      });
    }

    function winnerNames(names) {
      if (names.length <= 1) return names;

      const winners = new Set();
      for (const row of data.points) {
        const candidates = row.values.filter(item => names.includes(item.name));
        if (candidates.length === 0) continue;

        const best = Math.min(...candidates.map(item => item.mean));
        for (const item of candidates) {
          if (Math.abs(item.mean - best) <= Math.max(0.01, best * 0.00001)) {
            winners.add(item.name);
          }
        }
      }

      return [...winners];
    }

    function isUbqVariant(name) {
      return name === "rust-ubq" || name === "rust-ubq-config" || name.startsWith("rust-ubq-");
    }

    function isRbbqVariant(name) {
      return name === "rust-rbbq" || name === "rust-rbbq-config" || name.startsWith("rust-rbbq-block");
    }

    function renderSummary(selectedNames) {
      const all = flatten(selectedNames);
      if (all.length === 0) {
        document.getElementById("summary").innerHTML = "";
        return;
      }
      const fastest = [...all].sort((a, b) => a.mean - b.mean)[0];
      const highest = [...all].sort((a, b) => b.throughput - a.throughput)[0];
      const bestUbq = all
        .filter(item => isUbqVariant(item.name))
        .sort((a, b) => b.throughput - a.throughput)[0];
      const bestRbbq = all
        .filter(item => isRbbqVariant(item.name))
        .sort((a, b) => b.throughput - a.throughput)[0];

      const stats = [
        ["Fastest elapsed", `${fastest.name}`, `${fastest.mean.toFixed(2)} ms at ${fastest.threads} threads`],
        ["Highest throughput", `${highest.name}`, `${highest.throughput.toFixed(2)} Mops/s at ${highest.threads} threads`],
        ["Best UBQ point", bestUbq ? `${bestUbq.name}` : "n/a", bestUbq ? `${bestUbq.throughput.toFixed(2)} Mops/s at ${bestUbq.threads} threads` : "No UBQ series selected"],
        ["Best RBBQ point", bestRbbq ? `${bestRbbq.name}` : "n/a", bestRbbq ? `${bestRbbq.throughput.toFixed(2)} Mops/s at ${bestRbbq.threads} threads` : "No RBBQ series selected"]
      ];

      document.getElementById("summary").innerHTML = stats.map(([label, value, detail]) => `
        <div class="stat">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
          <div class="detail">${detail}</div>
        </div>
      `).join("");
    }

    function flatten(selectedNames) {
      return data.points.flatMap(row => row.values.filter(item => selectedNames.includes(item.name)));
    }

    function renderChart(config) {
      const { svg, legend, selectedNames, metric, unit, yLabel, lowerIsBetter } = config;
      svg.replaceChildren();
      legend.replaceChildren();

      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 420;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const margin = { top: 22, right: 26, bottom: 48, left: 72 };
      const plot = {
        x0: margin.left,
        y0: margin.top,
        x1: width - margin.right,
        y1: height - margin.bottom
      };
      const plotWidth = plot.x1 - plot.x0;
      const plotHeight = plot.y1 - plot.y0;

      if (selectedNames.length === 0) {
        text(svg, width / 2, height / 2, "No series selected", "axis-label", "middle");
        return;
      }

      const series = selectedNames.map(name => ({
        name,
        color: colors[data.names.indexOf(name) % colors.length],
        points: data.points.map(row => row.values.find(item => item.name === name))
      }));

      const values = series.flatMap(item => item.points.map(point => point[metric]));
      const positiveValues = values.filter(value => value > 0);
      const max = Math.max(...values);
      const min = state.yScale === "log" ? Math.min(...positiveValues) : 0;
      const yMax = state.yScale === "log" ? max * 1.08 : niceMax(max);
      const yMin = state.yScale === "log" ? min / 1.08 : 0;

      const xMin = Math.log2(Math.min(...data.threads));
      const xMax = Math.log2(Math.max(...data.threads));
      const x = threads => plot.x0 + ((Math.log2(threads) - xMin) / (xMax - xMin)) * plotWidth;
      const y = value => {
        if (state.yScale === "log") {
          const lv = Math.log10(Math.max(value, Number.EPSILON));
          return plot.y1 - ((lv - Math.log10(yMin)) / (Math.log10(yMax) - Math.log10(yMin))) * plotHeight;
        }
        return plot.y1 - ((value - yMin) / (yMax - yMin)) * plotHeight;
      };

      const yTicks = state.yScale === "log" ? logTicks(yMin, yMax) : linearTicks(yMin, yMax, 6);
      for (const tick of yTicks) {
        line(svg, plot.x0, y(tick), plot.x1, y(tick), "grid-line");
        text(svg, plot.x0 - 10, y(tick) + 4, formatTick(tick), "tick text", "end");
      }

      for (const threads of data.threads) {
        line(svg, x(threads), plot.y0, x(threads), plot.y1, "grid-line");
        text(svg, x(threads), plot.y1 + 25, threads, "tick text", "middle");
      }

      line(svg, plot.x0, plot.y1, plot.x1, plot.y1, "axis");
      line(svg, plot.x0, plot.y0, plot.x0, plot.y1, "axis");
      text(svg, (plot.x0 + plot.x1) / 2, height - 10, "Threads", "axis-label", "middle");
      rotatedText(svg, 18, (plot.y0 + plot.y1) / 2, yLabel, "axis-label");

      for (const item of series) {
        const points = item.points.map(point => [x(point.threads), y(point[metric]), point]);
        path(svg, points.map(([px, py], index) => `${index === 0 ? "M" : "L"} ${px} ${py}`).join(" "), item.color);

        for (const [px, py, point] of points) {
          drawErrorBar(svg, point, metric, x, y, item.color, state.yScale);
          circle(svg, px, py, 4, item.color, point, unit, metric, lowerIsBetter);
        }

        const legendItem = document.createElement("span");
        legendItem.className = "legend-item";
        legendItem.innerHTML = `<span class="swatch" style="background:${item.color}"></span>${item.name}`;
        legend.appendChild(legendItem);
      }
    }

    function drawErrorBar(svg, point, metric, x, y, color, scale) {
      let low;
      let high;
      if (metric === "mean") {
        low = Math.max(0.0001, point.mean - point.error);
        high = point.mean + point.error;
      } else {
        low = 20000 / (point.mean + point.error);
        high = 20000 / Math.max(0.0001, point.mean - point.error);
      }

      if (scale === "log" && (low <= 0 || high <= 0)) return;

      const px = x(point.threads);
      const yLow = y(low);
      const yHigh = y(high);
      line(svg, px, yLow, px, yHigh, "error-bar", color);
      line(svg, px - 4, yLow, px + 4, yLow, "error-bar", color);
      line(svg, px - 4, yHigh, px + 4, yHigh, "error-bar", color);
    }

    function niceMax(value) {
      const exponent = Math.floor(Math.log10(value));
      const base = Math.pow(10, exponent);
      const fraction = value / base;
      const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
      return nice * base;
    }

    function linearTicks(min, max, count) {
      const step = niceMax((max - min) / count);
      const ticks = [];
      for (let value = min; value <= max + step * 0.5; value += step) {
        ticks.push(value);
      }
      return ticks;
    }

    function logTicks(min, max) {
      const ticks = [];
      const start = Math.floor(Math.log10(min));
      const end = Math.ceil(Math.log10(max));
      for (let exp = start; exp <= end; exp++) {
        for (const base of [1, 2, 5]) {
          const value = base * Math.pow(10, exp);
          if (value >= min && value <= max) ticks.push(value);
        }
      }
      return ticks;
    }

    function formatTick(value) {
      if (value >= 1000) return Math.round(value).toLocaleString();
      if (value >= 100) return Math.round(value);
      if (value >= 10) return value.toFixed(0);
      if (value >= 1) return value.toFixed(1).replace(/\.0$/, "");
      return value.toPrecision(1);
    }

    function line(svg, x1, y1, x2, y2, className, stroke) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
      el.setAttribute("x1", x1);
      el.setAttribute("y1", y1);
      el.setAttribute("x2", x2);
      el.setAttribute("y2", y2);
      el.setAttribute("class", className);
      if (stroke) el.setAttribute("stroke", stroke);
      svg.appendChild(el);
    }

    function path(svg, d, stroke) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "path");
      el.setAttribute("d", d);
      el.setAttribute("class", "series-line");
      el.setAttribute("stroke", stroke);
      svg.appendChild(el);
    }

    function circle(svg, cx, cy, r, fill, point, unit, metric, lowerIsBetter) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("cx", cx);
      el.setAttribute("cy", cy);
      el.setAttribute("r", r);
      el.setAttribute("fill", fill);
      el.setAttribute("class", "point");
      el.addEventListener("mouseenter", event => showTooltip(event, point, unit, metric, lowerIsBetter));
      el.addEventListener("mousemove", event => showTooltip(event, point, unit, metric, lowerIsBetter));
      el.addEventListener("mouseleave", hideTooltip);
      svg.appendChild(el);
    }

    function text(svg, x, y, value, className, anchor) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("class", className);
      el.setAttribute("text-anchor", anchor);
      el.textContent = value;
      svg.appendChild(el);
    }

    function rotatedText(svg, x, y, value, className) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("class", className);
      el.setAttribute("text-anchor", "middle");
      el.setAttribute("transform", `rotate(-90 ${x} ${y})`);
      el.textContent = value;
      svg.appendChild(el);
    }

    function showTooltip(event, point, unit, metric, lowerIsBetter) {
      const value = metric === "mean" ? point.mean : point.throughput;
      tooltip.innerHTML = `
        <strong>${point.name}</strong>
        Threads: ${point.threads}<br>
        ${lowerIsBetter ? "Elapsed" : "Throughput"}: ${value.toFixed(2)} ${unit}<br>
        Mean elapsed: ${point.mean.toFixed(2)} ms +/- ${point.error.toFixed(2)} ms<br>
        Throughput: ${point.throughput.toFixed(2)} Mops/s
      `;
      tooltip.style.display = "block";
      const offset = 14;
      const x = Math.min(window.innerWidth - tooltip.offsetWidth - offset, event.clientX + offset);
      const y = Math.min(window.innerHeight - tooltip.offsetHeight - offset, event.clientY + offset);
      tooltip.style.left = `${x}px`;
      tooltip.style.top = `${y}px`;
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }
  </script>
</body>
</html>
